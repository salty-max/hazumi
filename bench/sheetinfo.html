<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sheet layout</title>
    <style>
      body {
        background: #131118;
        color: #e9e6f1;
        font:
          13px ui-monospace,
          monospace;
        padding: 12px;
        margin: 0;
      }
      pre {
        margin: 0 0 10px;
        color: #8b849b;
      }
      .line {
        display: flex;
        gap: 10px;
      }
      .cellwrap {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
      }
      .tag {
        color: #8b849b;
        font-size: 12px;
      }
      canvas {
        border: 1px solid #3a3350;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <pre id="out">reading…</pre>
    <div id="strip"></div>
    <script type="module" src="./dist/sheetinfo.js"></script>
  </body>
</html>
